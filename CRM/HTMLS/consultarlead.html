<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Lead - Pipeline de Vendas</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="title">Consultar Lead</h1>
                <p class="subtitle">Busque e visualize informações de leads</p>
            </div>
        </header>
        
        <main class="main-content">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card">
                        <div class="card-body p-4">
                            <h2 class="h5 mb-3">Pesquise o lead para consultar pelo número:</h2>
                            
                            <form id="searchForm" method="POST" action="/consultarLead">
                                <div class="mb-3">
                                    <label for="numero" class="form-label">Número do Lead:</label>
                                    <input type="text" class="form-control" id="numero" name="numero" required 
                                           placeholder="Digite o número do lead">
                                </div>

                                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                    <a href="index.html" class="btn btn-secondary me-md-2">Voltar</a>
                                    <button type="submit" class="btn btn-primary">Buscar Lead</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="footer">
            <p>&copy; 2025 Sistema de Pipeline de Vendas</p>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
