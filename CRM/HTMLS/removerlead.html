<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover Lead - Pipeline de Vendas</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="title">Remover Lead</h1>
                <p class="subtitle">Exclua um lead do seu pipeline</p>
            </div>
        </header>
        
        <main class="main-content">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card">
                        <div class="card-body p-4">
                            <div class="alert alert-warning mb-4" role="alert">
                                <strong>Atenção!</strong> Esta ação não pode ser desfeita. O lead será permanentemente removido do sistema.
                            </div>
                            
                            <form action="/remove" method="POST" onsubmit="return confirm('Tem certeza que deseja remover este lead? Esta ação não pode ser desfeita.')">
                                <div class="mb-3">
                                    <label for="numero" class="form-label">Número do Lead:</label>
                                    <input type="text" class="form-control" id="numero" name="numero" required 
                                           placeholder="Digite o número do lead a ser removido">
                                </div>

                                <div class="mb-3">
                                    <label for="motivo" class="form-label">Motivo da Remoção:</label>
                                    <select class="form-select" id="motivo" name="motivo" required>
                                        <option value="">Selecione o motivo</option>
                                        <option value="duplicado">Lead Duplicado</option>
                                        <option value="nao-qualificado">Lead Não Qualificado</option>
                                        <option value="perdido">Oportunidade Perdida</option>
                                        <option value="cancelado">Cliente Cancelou</option>
                                        <option value="outros">Outros</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="observacoes" class="form-label">Observações (opcional):</label>
                                    <textarea class="form-control" id="observacoes" name="observacoes" rows="3" 
                                              placeholder="Adicione observações sobre a remoção..."></textarea>
                                </div>

                                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                    <a href="/" class="btn btn-secondary me-md-2">Voltar</a>
                                    <button type="submit" class="btn btn-danger">Remover Lead</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="footer">
            <p>&copy; 2025 Sistema de Pipeline de Vendas</p>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
