<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Atividade - Pipeline de Vendas</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="title">Registrar Atividade</h1>
                <p class="subtitle">Documente interações com seus leads</p>
            </div>
        </header>
        
        <main class="main-content">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card">
                        <div class="card-body p-4">
                            <form action="/registrarAtividade" method="POST">
                                <div class="mb-3">
                                    <label for="numeroLead" class="form-label">Número do Lead:</label>
                                    <input type="text" class="form-control" id="numeroLead" name="numeroLead" required 
                                           placeholder="Digite o número do lead">
                                </div>

                                <div class="mb-3">
                                    <label for="tipoAtividade" class="form-label">Tipo de Atividade:</label>
                                    <select class="form-select" id="tipoAtividade" name="tipoAtividade" required>
                                        <option value="">Selecione o tipo</option>
                                        <option value="ligacao">Ligação</option>
                                        <option value="email">E-mail</option>
                                        <option value="reuniao">Reunião</option>
                                        <option value="proposta">Proposta</option>
                                        <option value="follow-up">Follow-up</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="descricao" class="form-label">Descrição:</label>
                                    <textarea class="form-control" id="descricao" name="descricao" rows="4" required 
                                              placeholder="Descreva a atividade realizada..."></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="dataAtividade" class="form-label">Data da Atividade:</label>
                                    <input type="datetime-local" class="form-control" id="dataAtividade" name="dataAtividade" required>
                                </div>

                                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                    <a href="index.html" class="btn btn-secondary me-md-2">Voltar</a>
                                    <button type="submit" class="btn btn-info">Registrar Atividade</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="footer">
            <p>&copy; 2025 Sistema de Pipeline de Vendas</p>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
